# Team 1 CI pipeline.
#
# Runs on every push to any branch, on every pull request into main, and by
# hand from the Actions tab. Four jobs:
#
#   checks      (Ubuntu, about 1 minute)
#               tests the checkers themselves, then runs the CREDITS check,
#               JSON data validation and style check
#   rule-tests  (Ubuntu, about 1 minute, runs at the same time as "checks")
#               runs the GML game-rule tests in Node.js, without GameMaker,
#               then plants bugs one at a time to check a test catches each
#   access-key  (Ubuntu, a few seconds, runs at the same time as "checks")
#               reports whether the ACCESS_KEY secret is set
#   game-tests  (Windows, runs only if "checks" and "rule-tests" passed and
#               ACCESS_KEY is set; otherwise it shows as skipped)
#               builds the game with GameMaker's command-line builder (Igor),
#               launches it with --run-tests, and fails if any GML test failed
#
# Branch protection on main requires all jobs to pass before a merge. A
# skipped job counts as passed.
#
# To turn on the game build: add a repository secret named ACCESS_KEY
# containing a GameMaker access key (Settings > Secrets and variables >
# Actions). Generating a key needs a GameMaker account with a paid licence;
# a free account's Access Keys page has no Generate button.

name: CI

# No path filters: with branch protection, a pull request that skipped the
# pipeline (for example one that only edits a .md file) could never merge.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Style and data checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install -r tools/requirements-dev.txt

      # If the checkers below were broken they could pass bad code, so their
      # own tests run first.
      - name: Test the checkers
        run: python -m pytest tools/tests -q

      - name: Check that a CREDITS file exists
        run: |
          if [ -z "$(find . -maxdepth 2 -iname 'credits*' -not -path './.git/*' -print -quit)" ]; then
            echo "::error title=Missing CREDITS file::Add a CREDITS file listing every third-party asset and its license."
            exit 1
          fi

      - name: Validate JSON data files
        run: python tools/validate_data.py

      - name: Check style rules
        run: python tools/check_style.py

  rule-tests:
    name: Game rule tests (fast, Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Loads scr_test_framework, scr_rules_* and scr_tests_rules_* from
      # tools/gml and runs them with stand-ins for GameMaker's built-in
      # functions: the 29 framework self-tests plus the game-rule tests.
      # The rule scripts live in tools/gml because they are not yet registered
      # in the GameMaker project.
      - name: Run the GML rule tests in Node.js
        run: node tools/gml_node/run.js --scripts tools/gml --out test-output-node

      - name: Check test results
        run: python tools/ci/check_test_results.py test-output-node/test_results.json

      # Plants one bug at a time in a copy of the rule scripts (for example
      # "health can go below 0") and fails if any bug is not caught by a test.
      # This proves the tests check edge cases, not only the happy path.
      - name: Check the tests catch planted bugs (mutation testing)
        run: python tools/gml_node/check_mutations.py --scripts tools/gml --json test-output-node/mutations.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-node
          path: |
            test-output-node/test_results.json
            test-output-node/mutations.json
          if-no-files-found: warn
          retention-days: 14

  # Secrets cannot be read in a job's "if:", so this job turns "is ACCESS_KEY
  # set?" into an output that game-tests can check.
  access-key:
    name: Check for GameMaker access key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check whether the ACCESS_KEY secret is set
        id: check
        env:
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: |
          if [ -n "$ACCESS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Game build skipped::No ACCESS_KEY secret, so the Windows build and in-game GML tests are skipped. See the comment at the top of ci.yml to turn them on."
          fi

  game-tests:
    name: Build game and run GML tests
    needs: [checks, rule-tests, access-key]
    if: needs.access-key.outputs.present == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Find the GameMaker project file
        id: find_yyp
        shell: pwsh
        run: |
          $yyp = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.yyp |
            Where-Object { $_.FullName -notmatch '[\\/](tools|\.git)[\\/]' })
          if ($yyp.Count -ne 1) { throw "Expected one .yyp file, found $($yyp.Count)" }
          Write-Output "Project: $($yyp[0].FullName)"
          "yyp-path=$($yyp[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Installs the GameMaker runtime version saved in our .yyp, so CI builds
      # with the same version we use in the IDE. Cached between runs.
      - name: Install GameMaker build tools (Igor)
        id: igor
        uses: bscotch/igor-setup@v1
        with:
          access-key: ${{ secrets.ACCESS_KEY }}
          target-yyp: ${{ steps.find_yyp.outputs.yyp-path }}
          cache: true

      # yyc: false builds with the VM, like the Run button in the IDE. It is
      # faster than the YoYo Compiler and needs no C++ toolchain.
      - name: Build Windows game
        id: build
        uses: bscotch/igor-build@v1
        with:
          yyp-path: ${{ steps.find_yyp.outputs.yyp-path }}
          user-dir: ${{ steps.igor.outputs.user-dir }}
          yyc: false

      - name: Run the game in test mode
        shell: pwsh
        run: ./tools/ci/run-gml-tests.ps1 -BuildDir "${{ steps.build.outputs.out-dir }}" -OutDir test-output -TimeoutSeconds 300

      - name: Check test results
        run: python tools/ci/check_test_results.py test-output/test_results.json

      # Runs even when a step above failed, so the log is there to diagnose it.
      - name: Upload test results and game log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output/test_results.json
            test-output/game-log.txt
          if-no-files-found: warn
          retention-days: 14
