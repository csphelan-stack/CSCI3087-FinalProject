# This workflow runs a linter and a test suite every time code is pushed.

name: CI

# Controls when the workflow will run
on:
  # Runs on every push to any branch
  push:
  # Runs on every pull request
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks out your repository so the job can access your files
      - uses: actions/checkout@v4

      # Installs Python 3.12 on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs the linter (flake8) and the test framework (pytest)
      - name: Install dependencies
        run: pip install flake8 pytest

      # Checks the tools and tests folders for style and syntax errors
      - name: Lint (flake8)
        run: flake8 tools tests --max-line-length=100

      # Runs every test in the tests folder
      - name: Run unit tests
        run: pytest -v

      # Scans your GameMaker .yy and .yyp files for broken JSON
      - name: Validate GameMaker project files
        run: python tools/gm_check.py .
      - name: Validate GameMaker project files
        run: python tools/gm_check.py .
